# Robotic arm digital twin relay (codes/relay-server). The prefix is stripped:
# /robotarm/healthz reaches the relay as /healthz. Resolved per request, so
# nginx starts with the relay stopped (the route then answers 502).
location /robotarm/ {
    set $relay http://relay:8080;
    rewrite ^/robotarm/(.*)$ /$1 break;
    proxy_pass $relay;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
