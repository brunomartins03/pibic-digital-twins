# Archipelago WebSocket (ws-connector, "comms" profile). The upstream is a
# variable so nginx resolves it per request and starts without the comms
# services; the route answers 502 while they are down.
location = /archipelago/ws {
    set $ws_connector http://ws-connector:5000;
    proxy_pass $ws_connector/ws$is_args$args;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
