# Adapted from catalyst-owner local/nginx/conf.d/00-katalyst.conf. TLS is
# terminated by a proxy in front of this server (or not used, on localhost).
rewrite_log off;

include /etc/nginx/include/upstream.conf;
include /etc/nginx/include/rates.conf;

server {
    listen 80 reuseport;
    server_name _;
    # Only /content/entities is allowed 256M (see content.conf).
    client_max_body_size 10M;

    root /etc/nginx/html;

    include /etc/nginx/include/routes.conf;
}
